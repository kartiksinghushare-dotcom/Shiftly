<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF7">
  <title>Shiftly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-bg: #FBFAF7;
      --color-surface: #FFFFFF;
      --color-text: #1C1C1A;
      --color-text-muted: #6B6A65;
      --color-text-faint: #9C9A92;
      --color-border: #E8E5DD;
      --color-border-strong: #C8C5BB;
      --color-accent: #2C5A4F;
      --color-accent-hover: #1E4036;
      --color-accent-soft: #E8F0EC;
      --color-danger: #A0392C;
      --color-danger-soft: #FBEAE7;
      --color-warning-soft: #FBF0DD;
      --color-warning-text: #8A6620;

      --font-display: "Fraunces", "Noto Naskh Arabic", Georgia, serif;
      --font-body: "Plus Jakarta Sans", "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, sans-serif;

      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
      --space-12: 48px;

      --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
      --max-content-width: 540px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      font-size: 16px; line-height: 1.5;
      color: var(--color-text); background: var(--color-bg);
      min-height: 100vh; min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    [hidden] { display: none !important; }

    .loading-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg); z-index: 100;
    }
    .loader, .loader-inline {
      border: 2px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader { width: 28px; height: 28px; }
    .loader-inline { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-page {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-6);
      background:
        radial-gradient(circle at 80% -10%, #F0EDE2 0%, transparent 50%),
        radial-gradient(circle at -10% 110%, #EBE8DD 0%, transparent 50%),
        var(--color-bg);
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-10) var(--space-8);
      display: flex; flex-direction: column; gap: var(--space-8);
    }
    .brand { text-align: center; }
    .brand-mark {
      font-family: var(--font-display);
      font-weight: 400; font-size: 40px;
      font-variation-settings: "opsz" 80;
      margin: 0; letter-spacing: -0.02em;
    }
    .brand-tagline {
      margin: var(--space-1) 0 0;
      color: var(--color-text-muted); font-size: 14px;
    }
    .brand-small {
      font-family: var(--font-display);
      font-weight: 500; font-size: 20px;
      font-variation-settings: "opsz" 24;
      letter-spacing: -0.01em;
    }

    .form { display: flex; flex-direction: column; gap: var(--space-5); }
    .field { display: flex; flex-direction: column; gap: var(--space-2); }
    .field label {
      font-size: 13px; font-weight: 500;
      color: var(--color-text-muted);
      letter-spacing: 0.01em;
    }
    .field input, .field select, .field textarea {
      appearance: none; font-size: 16px;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
      width: 100%;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-soft);
    }
    .field input:disabled { background: var(--color-bg); color: var(--color-text-muted); }
    .field-hint { font-size: 12px; color: var(--color-text-muted); margin-block-start: var(--space-1); }

    .btn {
      appearance: none; border: none;
      font-size: 15px; font-weight: 500;
      padding-block: var(--space-3); padding-inline: var(--space-5);
      border-radius: var(--radius);
      transition: background 150ms var(--ease), transform 80ms var(--ease);
      min-height: 48px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--space-2);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--color-accent); color: #fff; }
    .btn-primary:not(:disabled):hover { background: var(--color-accent-hover); }
    .btn-secondary {
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      color: var(--color-text);
    }
    .btn-secondary:hover { background: var(--color-bg); }
    .btn-link {
      background: none; border: none;
      color: var(--color-text-muted); font-size: 14px;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm); font-weight: 500;
    }
    .btn-link:hover { color: var(--color-text); }
    .back-btn {
      background: none; border: none;
      color: var(--color-text); font-size: 16px;
      padding: var(--space-2);
      margin-inline-start: calc(-1 * var(--space-2));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; gap: var(--space-2);
      font-weight: 500;
    }
    .back-btn:hover { background: var(--color-bg); }
    [dir="rtl"] .back-btn .back-arrow { transform: scaleX(-1); }

    .lang-toggle {
      display: flex; align-items: center; justify-content: center;
      gap: var(--space-2); font-size: 13px; color: var(--color-text-muted);
    }
    .lang-btn {
      background: none; border: none; color: inherit;
      font-size: inherit; font-family: inherit;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }
    .lang-btn.active { color: var(--color-accent); font-weight: 500; }
    .lang-btn:hover { color: var(--color-text); }
    .lang-sep { color: var(--color-text-faint); }

    .error-message {
      background: var(--color-danger-soft);
      color: var(--color-danger);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      font-size: 14px;
    }

    .app-shell {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-block-end: 1px solid var(--color-border);
      background: var(--color-bg);
      position: sticky; inset-block-start: 0; z-index: 10;
      gap: var(--space-3);
    }
    .header-left { display: flex; align-items: center; gap: var(--space-3); min-width: 0; flex: 1; }
    .user-menu { display: flex; align-items: center; gap: var(--space-3); font-size: 14px; flex-shrink: 0; }
    .user-name { font-weight: 500; display: none; }
    .user-role {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--color-accent);
      padding: 2px var(--space-2);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-sm);
    }
    @media (min-width: 480px) { .user-name { display: inline; } }

    .app-main {
      flex: 1; width: 100%;
      max-width: var(--max-content-width);
      margin-inline: auto;
      padding: var(--space-6) var(--space-5);
    }

    .page-title {
      font-family: var(--font-display);
      font-weight: 400; font-size: 28px;
      font-variation-settings: "opsz" 48;
      letter-spacing: -0.01em;
      margin: 0 0 var(--space-2);
    }
    .page-subtitle { color: var(--color-text-muted); font-size: 14px; margin: 0 0 var(--space-8); }
    .section-title {
      font-size: 13px; font-weight: 500;
      color: var(--color-text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: var(--space-6) 0 var(--space-3);
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-5);
      margin-block-end: var(--space-4);
      transition: border-color 150ms var(--ease);
    }
    .card-clickable {
      cursor: pointer; background: var(--color-surface);
      width: 100%; text-align: start;
      font: inherit; color: inherit;
      display: block;
    }
    .card-clickable:hover { border-color: var(--color-border-strong); }
    .card-clickable:active { transform: scale(0.99); }
    .card h3 { margin: 0 0 var(--space-2); font-size: 16px; font-weight: 500; }
    .card p { margin: 0; color: var(--color-text-muted); font-size: 14px; }

    .toolbar {
      display: flex; gap: var(--space-3);
      margin-block-end: var(--space-5);
      align-items: center; flex-wrap: wrap;
    }
    .toolbar .search-input {
      flex: 1; min-width: 0;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      font-size: 15px;
    }
    .toolbar .search-input:focus {
      outline: none; border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-soft);
    }

    .user-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: var(--space-4) var(--space-5);
      margin-block-end: var(--space-3);
      cursor: pointer;
      transition: border-color 150ms var(--ease);
      display: flex; flex-direction: column; gap: var(--space-1);
    }
    .user-card:hover { border-color: var(--color-border-strong); }
    .user-card-inactive { opacity: 0.55; }
    .user-card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .user-card-name { font-weight: 500; font-size: 16px; }
    .user-card-meta { font-size: 13px; color: var(--color-text-muted); }
    .user-card-managers { font-size: 12px; color: var(--color-text-faint); }

    .role-pill {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      font-weight: 500; flex-shrink: 0;
    }
    .role-pill-admin { background: var(--color-accent-soft); color: var(--color-accent); }
    .role-pill-manager { background: var(--color-warning-soft); color: var(--color-warning-text); }
    .role-pill-user { background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border); }
    .inactive-tag {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--color-danger);
      margin-inline-start: var(--space-2);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-12) var(--space-5);
      color: var(--color-text-muted);
    }
    .empty-state p { margin: 0 0 var(--space-2); }

    .picker-list {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
    }
    .picker-item {
      display: flex; align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-block-end: 1px solid var(--color-border);
      cursor: pointer; user-select: none;
    }
    .picker-item:last-child { border-block-end: none; }
    .picker-item:hover { background: var(--color-bg); }
    .picker-item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--color-accent); cursor: pointer;
      flex-shrink: 0;
    }
    .picker-item-name { font-weight: 500; }
    .picker-item-meta { font-size: 13px; color: var(--color-text-muted); }
    .picker-item-text { flex: 1; min-width: 0; }
    .picker-empty { padding: var(--space-6); text-align: center; color: var(--color-text-muted); font-size: 14px; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
    }
    .toggle-row-info { flex: 1; }
    .toggle-row-label { font-weight: 500; font-size: 15px; }
    .toggle-row-hint { font-size: 13px; color: var(--color-text-muted); margin-block-start: 2px; }

    .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0;
      background: var(--color-border-strong);
      border-radius: 13px; cursor: pointer;
      transition: background 150ms var(--ease);
    }
    .switch .slider::before {
      content: ""; position: absolute;
      width: 20px; height: 20px;
      inset-block-start: 3px; inset-inline-start: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 150ms var(--ease);
    }
    .switch input:checked + .slider { background: var(--color-accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    [dir="rtl"] .switch input:checked + .slider::before { transform: translateX(-18px); }

    .form-actions { display: flex; gap: var(--space-3); margin-block-start: var(--space-8); }
    .form-actions .btn { flex: 1; }

    [dir="rtl"] .brand-mark { letter-spacing: 0; }
  </style>
</head>

<body>
  <div class="loading-screen" id="loading-screen"><span class="loader" aria-label="Loading"></span></div>

  <main class="login-page" id="login-view" hidden>
    <div class="login-card">
      <div class="brand">
        <h1 class="brand-mark">Shiftly</h1>
        <p class="brand-tagline" data-i18n="login.tagline">Daily team audit</p>
      </div>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email" data-i18n="login.email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="login.password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary" data-i18n="login.signin">Sign in</button>
        <div id="login-error" class="error-message" style="text-align:center" hidden></div>
      </form>
      <div class="lang-toggle">
        <button type="button" class="lang-btn" data-lang="en">English</button>
        <span class="lang-sep">·</span>
        <button type="button" class="lang-btn" data-lang="ar">العربية</button>
      </div>
    </div>
  </main>

  <div class="app-shell" id="app-view" hidden>
    <header class="app-header">
      <div class="header-left">
        <button type="button" id="back-btn" class="back-btn" hidden>
          <span class="back-arrow">←</span>
          <span id="back-label" data-i18n="app.back">Back</span>
        </button>
        <span id="header-title" class="brand-small">Shiftly</span>
      </div>
      <div class="user-menu">
        <span id="user-name" class="user-name"></span>
        <span id="user-role" class="user-role"></span>
        <button type="button" id="logout-btn" class="btn-link" data-i18n="app.logout">Logout</button>
      </div>
    </header>
    <main class="app-main" id="app-main"></main>
  </div>

    // ========== I18N ==========
    const I18n = (() => {
      let current = "en";
      function t(key, fb) {
        const parts = key.split(".");
        let v = STRINGS[current];
        for (const p of parts) {
          if (v && typeof v === "object" && p in v) v = v[p];
          else return fb ?? key;
        }
        return typeof v === "string" ? v : (fb ?? key);
      }
      function apply() {
        document.querySelectorAll("[data-i18n]").forEach(el => {
          el.textContent = t(el.getAttribute("data-i18n"), el.textContent);
        });
      }
      function direction() {
        document.documentElement.dir = current === "ar" ? "rtl" : "ltr";
        document.documentElement.lang = current;
      }
      function setLang(lang) {
        if (!STRINGS[lang]) lang = "en";
        current = lang;
        localStorage.setItem("shiftly_lang", lang);
        direction(); apply();
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
        sb.auth.getSession().then(({ data: { session } }) => {
          if (session) sb.from("profiles").update({ preferred_language: lang }).eq("id", session.user.id);
        });
        if (App.state.profile) Router.rerender();
      }
      function init() {
        setLang(localStorage.getItem("shiftly_lang") || "en");
        document.querySelectorAll(".lang-btn").forEach(b => {
          b.addEventListener("click", () => setLang(b.dataset.lang));
        });
      }
      return { init, t, setLang, getLang: () => current };
    })();

    // ========== AUTH ==========
    const Auth = (() => {
      async function getCurrentProfile() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) return null;
        const { data: profile, error } = await sb.from("profiles")
          .select("id, full_name, email, role, preferred_language, active")
          .eq("id", session.user.id).single();
        if (error || !profile || !profile.active) {
          await sb.auth.signOut();
          return null;
        }
        return profile;
      }
      async function login(email, password) {
        const { error } = await sb.auth.signInWithPassword({
          email: email.trim().toLowerCase(), password
        });
        if (error) throw error;
        const profile = await getCurrentProfile();
        if (!profile) throw new Error("Your account isn't active. Contact your admin.");
        return profile;
      }
      async function logout() {
        await sb.auth.signOut();
        App.state.profile = null;
        Router.go("login");
      }
      return { getCurrentProfile, login, logout };
    })();

    // ========== API ==========
    const API = {
      async listUsers() {
        const { data: users, error } = await sb.from("profiles")
          .select("id, full_name, email, role, department, job_title, phone, active")
          .order("full_name");
        if (error) throw error;
        const { data: links, error: lErr } = await sb.from("user_managers")
          .select("user_id, manager_id");
        if (lErr) throw lErr;
        const byUser = {};
        for (const l of (links || [])) (byUser[l.user_id] ||= []).push(l.manager_id);
        const usersById = Object.fromEntries(users.map(u => [u.id, u]));
        return users.map(u => ({
          ...u,
          managers: (byUser[u.id] || []).map(mid => usersById[mid]).filter(Boolean)
        }));
      },
      async createUser(payload) {
        const { data, error } = await sb.functions.invoke("create-user", { body: payload });
        if (error) throw new Error(error.message || "Request failed");
        if (data?.error) throw new Error(data.error);
        return data;
      },
      async updateUser(userId, updates, managerIds) {
        const { error: uErr } = await sb.from("profiles").update(updates).eq("id", userId);
        if (uErr) throw uErr;
        const { error: dErr } = await sb.from("user_managers").delete().eq("user_id", userId);
        if (dErr) throw dErr;
        if (managerIds && managerIds.length > 0) {
          const rows = managerIds.map(mid => ({ user_id: userId, manager_id: mid }));
          const { error: iErr } = await sb.from("user_managers").insert(rows);
          if (iErr) throw iErr;
        }
      }
    };

    function escape(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]
      ));
    }

    // ========== ROUTER ==========
    const Router = (() => {
      let last = null;
      function setHeader(title, showBack) {
        document.getElementById("header-title").textContent = title;
        document.getElementById("back-btn").hidden = !showBack;
      }
      function go(route, data) {
        last = { route, data };
        document.getElementById("loading-screen").hidden = true;
        if (route === "login") {
          document.getElementById("app-view").hidden = true;
          document.getElementById("login-view").hidden = false;
          document.getElementById("login-form").reset();
          document.getElementById("login-error").hidden = true;
          const btn = document.getElementById("login-btn");
          btn.disabled = false;
          btn.textContent = I18n.t("login.signin");
          return;
        }
        document.getElementById("login-view").hidden = true;
        document.getElementById("app-view").hidden = false;
        const profile = App.state.profile;
        document.getElementById("user-name").textContent = profile.full_name;
        document.getElementById("user-role").textContent = I18n.t("role." + profile.role);
        if (route === "home") { setHeader("Shiftly", false); Views.home(); }
        else if (route === "users") { setHeader(I18n.t("users.title"), true); Views.usersList(); }
        else if (route === "user-form") {
          setHeader(data?.user ? I18n.t("user_form.edit_title") : I18n.t("user_form.new_title"), true);
          Views.userForm(data?.user || null);
        } else if (route === "audit") {
          setHeader(I18n.t("home.audit_log"), true);
          Views.auditStub();
        }
      }
      function back() {
        if (!last) return go("home");
        if (last.route === "user-form") return go("users");
        return go("home");
      }
      function rerender() { if (last) go(last.route, last.data); }
      return { go, back, rerender };
    })();

                  <div class="toggle-row-hint">${escape(I18n.t("user_form.active_hint"))}</div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="f-active" ${user.active ? "checked" : ""}>
                  <span class="slider"></span>
                </label>
              </div>
            ` : ""}

            <div id="form-error" class="error-message" style="text-align:center" hidden></div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" id="cancel-btn">${escape(I18n.t("user_form.cancel"))}</button>
              <button type="submit" class="btn btn-primary" id="save-btn">${escape(I18n.t("user_form.save"))}</button>
            </div>
          </form>
        `;

        // Manager picker
        const all = await API.listUsers();
        const others = all.filter(u => u.id !== user?.id);
        const currentMgrs = new Set((user?.managers || []).map(m => m.id));
        const pickerEl = document.getElementById("manager-picker");

        if (others.length === 0) {
          pickerEl.innerHTML = `<div class="picker-empty">${escape(I18n.t("user_form.managers_empty"))}</div>`;
        } else {
          pickerEl.innerHTML = `
            <div class="picker-list">
              ${others.map(u => `
                <label class="picker-item">
                  <input type="checkbox" data-mgr-id="${u.id}" ${currentMgrs.has(u.id) ? "checked" : ""}>
                  <div class="picker-item-text">
                    <div class="picker-item-name">${escape(u.full_name)}</div>
                    <div class="picker-item-meta">${escape(I18n.t("role." + u.role))}${u.department ? " · " + escape(u.department) : ""}</div>
                  </div>
                </label>
              `).join("")}
            </div>
          `;
        }

        document.getElementById("cancel-btn").addEventListener("click", () => Router.go("users"));

        document.getElementById("user-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const errBox = document.getElementById("form-error");
          const saveBtn = document.getElementById("save-btn");
          errBox.hidden = true;
          saveBtn.disabled = true;
          saveBtn.textContent = I18n.t("app.saving");
          try {
            const formData = {
              full_name: document.getElementById("f-name").value.trim(),
              email: document.getElementById("f-email").value.trim(),
              role: document.getElementById("f-role").value,
              department: document.getElementById("f-department").value.trim() || null,
              job_title: document.getElementById("f-job-title").value.trim() || null,
              phone: document.getElementById("f-phone").value.trim() || null,
            };
            const managerIds = Array.from(document.querySelectorAll("[data-mgr-id]:checked"))
              .map(el => el.dataset.mgrId);
            if (isEdit) {
              const activeEl = document.getElementById("f-active");
              await API.updateUser(user.id, {
                ...formData,
                active: activeEl ? activeEl.checked : true
              }, managerIds);
            } else {
              const password = document.getElementById("f-password").value;
              await API.createUser({ ...formData, password, manager_ids: managerIds });
            }
            Router.go("users");
          } catch (err) {
            errBox.textContent = err.message || I18n.t("user_form.save_failed");
            errBox.hidden = false;
            saveBtn.disabled = false;
            saveBtn.textContent = I18n.t("user_form.save");
          }
        });
      },

      auditStub() {
        document.getElementById("app-main").innerHTML = `
          <h1 class="page-title">${I18n.t("home.audit_log")}</h1>
          <p class="page-subtitle">${I18n.t("home.audit_hint")}</p>
          <div class="empty-state">
            <p>Coming in the next build.</p>
            <p style="font-size:13px">Actions are already being recorded in the background.</p>
          </div>
        `;
      }
    };

    // ========== APP ==========
    const App = {
      state: { profile: null },
      async start() {
        I18n.init();
        document.getElementById("login-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const errBox = document.getElementById("login-error");
          const btn = document.getElementById("login-btn");
          errBox.hidden = true;
          btn.disabled = true;
          btn.textContent = I18n.t("login.signing_in");
          try {
            const profile = await Auth.login(
              document.getElementById("email").value,
              document.getElementById("password").value
            );
            App.state.profile = profile;
            if (profile.preferred_language && profile.preferred_language !== I18n.getLang()) {
              I18n.setLang(profile.preferred_language);
            }
            Router.go("home");
          } catch (err) {
            errBox.textContent = err.message || I18n.t("login.error_generic");
            errBox.hidden = false;
            btn.disabled = false;
            btn.textContent = I18n.t("login.signin");
          }
        });
        document.getElementById("logout-btn").addEventListener("click", () => Auth.logout());
        document.getElementById("back-btn").addEventListener("click", () => Router.back());

        const profile = await Auth.getCurrentProfile();
        if (profile) {
          App.state.profile = profile;
          if (profile.preferred_language && profile.preferred_language !== I18n.getLang()) {
            I18n.setLang(profile.preferred_language);
          }
          Router.go("home");
        } else {
          Router.go("login");
        }
      }
    };

    document.addEventListener("DOMContentLoaded", () => App.start());
  </script>
</body>
</html>
